name: ClaudeExplainatory validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scene-graph-renderer:
    # This pins the one reusable animation engine; ClaudeExplainatory does not
    # ship or reimplement another drawing runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SaridakisStamatisChristos/AetherMotion
          ref: 1805f161ff9a0904306a0864ff0938f75cd70aad
          path: .aethermotion-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: .aethermotion-engine
      - run: npm test
      - run: node --check src/motion/bridge.mjs && node --check src/motion/contract.mjs && node --check src/motion/director.mjs && node --check bin/direct-graph.mjs && node --check bin/reel.mjs
      - run: npm run explain -- check examples/scene_graph_village.json --target 15
      - name: Real independent-object animation and pixel reproducibility
        run: npm run test:scene-graph
        env:
          AETHERMOTION_CLI: ${{ github.workspace }}/.aethermotion-engine/dist/cli/main.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-city-scene-graph-mp4
          path: |
            .reel-work/scene-graph-smoke/scene-graph.mp4
            .reel-work/scene-graph-smoke/frames/*.png
          retention-days: 7
          if-no-files-found: warn

  static-and-short-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/motion/bridge.mjs && node --check src/motion/contract.mjs
      - run: node --check bin/reel.mjs && node --check src/spec.mjs && node --check src/composition.mjs && node --check src/editorial/assets.mjs && node --check src/editorial/layout.mjs && node --check src/editorial/diagram.mjs && node --check src/editorial/bars.mjs
      - run: python3 -m py_compile tools/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:integration
      - run: npm install --no-audit --no-fund
      - run: node_modules/.bin/hyperframes tts --help && node_modules/.bin/hyperframes transcribe --help
      - run: npm run test:hyperframes
      - run: npm run test:editorial
      - run: npm run test:diagram
      - run: npm run test:bars
      - run: npm run test:draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stills
          path: |
            .reel-work/editorial-smoke/frames/*.png
            .reel-work/editorial-draft-smoke/output/still-*.png
            .reel-work/diagram-smoke/frames/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procedural-diagram-mp4
          path: |
            .reel-work/diagram-smoke/diagram.mp4
            .reel-work/diagram-smoke/frames/early.png
            .reel-work/diagram-smoke/frames/late.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinetic-bars-mp4
          path: |
            .reel-work/bars-smoke/kinetic-bars.mp4
            .reel-work/bars-smoke/frames/early.png
            .reel-work/bars-smoke/frames/late.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-short-mp4
          path: .reel-work/editorial-draft-smoke/output/*
          if-no-files-found: ignore
          retention-days: 7

  real-model-acceptance:
    # Genuine local models are a separate acceptance gate from synthetic CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/production-acceptance-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      HF_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash tools/setup_kokoro_runtime.sh
      - run: echo "HYPERFRAMES_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Genuine Kokoro and Whisper word-alignment check
        id: audio
        continue-on-error: true
        timeout-minutes: 12
        run: npm run test:real-audio
      - name: Real narrated short MP4 render
        id: video
        if: steps.audio.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm run explain -- check examples/real_model_acceptance.json --target 15
          npm run explain -- render examples/real_model_acceptance.json --draft --target 15
          node tools/real_video_verify.mjs
      - uses: actions/checkout@v4
        with:
          repository: SaridakisStamatisChristos/AetherMotion
          ref: 1805f161ff9a0904306a0864ff0938f75cd70aad
          path: .aethermotion-engine
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: .aethermotion-engine
      - name: Genuine voiced scene graph and independent moving actors
        id: motion
        if: steps.audio.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          AETHERMOTION_CLI: ${{ github.workspace }}/.aethermotion-engine/dist/cli/main.js
        run: |
          npm run explain -- check examples/scene_graph_village.json --target 15
          npm run explain -- render examples/scene_graph_village.json --draft --target 15
          node tools/scene_graph_real_verify.mjs
      - name: Publish truthful acceptance classification
        if: always()
        run: |
          mkdir -p out/real-model-smoke
          if test -f out/real-model-smoke/evidence.json; then
            echo 'Kokoro/Whisper: PASS_REAL_MODELS' > out/real-model-smoke/CI_STATUS.txt
          else
            echo 'Kokoro/Whisper: NOT_PASSED (inspect job logs)' > out/real-model-smoke/CI_STATUS.txt
          fi
          if test -f out/what-a-river-connects-draft/video-acceptance.json; then
            echo 'Narrated MP4: PASS_MACHINE_CHECKS' >> out/real-model-smoke/CI_STATUS.txt
          else
            echo 'Narrated MP4: NOT_PASSED_OR_SKIPPED' >> out/real-model-smoke/CI_STATUS.txt
          fi
          if test -f out/village-becomes-city-draft/scene-graph-acceptance.json; then
            echo 'Scene graph and real narrator: PASS_REAL_MODELS_AND_MOVING_OBJECTS' >> out/real-model-smoke/CI_STATUS.txt
          else
            echo 'Scene graph and real narrator: NOT_PASSED_OR_SKIPPED' >> out/real-model-smoke/CI_STATUS.txt
          fi
          cat out/real-model-smoke/CI_STATUS.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Human visual and speech-intelligibility review remains separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-acceptance
          path: |
            out/real-model-smoke/*
            out/what-a-river-connects-draft/*
            out/village-becomes-city-draft/*
          if-no-files-found: ignore
          retention-days: 7
