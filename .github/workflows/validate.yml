name: ClaudeExplainatory validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-and-short-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check bin/reel.mjs && node --check src/spec.mjs && node --check src/composition.mjs && node --check src/editorial/assets.mjs && node --check src/editorial/layout.mjs
      - run: python3 -m py_compile tools/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:integration
      - run: npm install --no-audit --no-fund
      - run: npm run test:hyperframes
      - run: npm run test:editorial
      - run: npm run test:draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stills
          path: |
            .reel-work/editorial-smoke/frames/*.png
            .reel-work/editorial-draft-smoke/output/still-*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-short-mp4
          path: .reel-work/editorial-draft-smoke/output/*
          if-no-files-found: ignore
          retention-days: 7
