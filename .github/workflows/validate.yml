name: ClaudeExplainatory validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-and-short-renders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check bin/reel.mjs && node --check src/spec.mjs && node --check src/composition.mjs && node --check src/editorial/assets.mjs && node --check src/editorial/layout.mjs
      - run: python3 -m py_compile tools/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run test:integration
      - run: npm install --no-audit --no-fund
      - run: node_modules/.bin/hyperframes tts --help && node_modules/.bin/hyperframes transcribe --help
      - run: npm run test:hyperframes
      - run: npm run test:editorial
      - run: npm run test:diagram
      - run: npm run test:draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-stills
          path: |
            .reel-work/editorial-smoke/frames/*.png
            .reel-work/editorial-draft-smoke/output/still-*.png
            .reel-work/diagram-smoke/frames/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-short-mp4
          path: .reel-work/editorial-draft-smoke/output/*
          if-no-files-found: ignore
          retention-days: 7

  real-model-acceptance:
    # Genuine local models are a separate acceptance gate from synthetic CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/production-acceptance-v0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      HF_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash tools/setup_kokoro_runtime.sh
      - run: echo "HYPERFRAMES_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Genuine Kokoro and Whisper word-alignment check
        id: audio
        continue-on-error: true
        timeout-minutes: 12
        run: npm run test:real-audio
      - name: Real narrated short MP4 render
        id: video
        if: steps.audio.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm run explain -- check examples/real_model_acceptance.json --target 15
          npm run explain -- render examples/real_model_acceptance.json --draft --target 15
          node tools/real_video_verify.mjs
      - name: Publish truthful acceptance classification
        if: always()
        run: |
          mkdir -p out/real-model-smoke
          if test -f out/real-model-smoke/evidence.json; then
            echo 'Kokoro/Whisper: PASS_REAL_MODELS' > out/real-model-smoke/CI_STATUS.txt
          else
            echo 'Kokoro/Whisper: NOT_PASSED (inspect job logs)' > out/real-model-smoke/CI_STATUS.txt
          fi
          if test -f out/what-a-river-connects-draft/video-acceptance.json; then
            echo 'Narrated MP4: PASS_MACHINE_CHECKS' >> out/real-model-smoke/CI_STATUS.txt
          else
            echo 'Narrated MP4: NOT_PASSED_OR_SKIPPED' >> out/real-model-smoke/CI_STATUS.txt
          fi
          cat out/real-model-smoke/CI_STATUS.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'Human visual and speech-intelligibility review remains separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-acceptance
          path: |
            out/real-model-smoke/*
            out/what-a-river-connects-draft/*
          if-no-files-found: ignore
          retention-days: 7
